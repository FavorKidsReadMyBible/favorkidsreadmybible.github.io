<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex, nofollow">
<style>

.tip{font-size:13px;color:#6e7775;margin:0}
.banner{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font:400 clamp(34px,7vw,64px)/1 var(--display);color:#fff;text-shadow:0 4px 0 #c86354,0 8px 24px #0006;text-transform:uppercase;pointer-events:none;opacity:0;white-space:nowrap}
.banner.show{animation:ban 1.6s ease forwards}
@keyframes ban{0%{opacity:0;transform:translate(-30%,-50%) scale(.8)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}80%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(-70%,-50%)}}
.confirm{position:absolute;display:flex;gap:6px;transform:translate(-50%,-140%)}
.confirm button{font:700 15px var(--body);border:3px solid #fff;border-radius:12px;padding:6px 12px;cursor:pointer;box-shadow:0 3px 0 #0003}

<div class="wrap">
  <header><div><span class="kicker">KIDS ARCADE · DRAFT</span><h1>Wall Defenders</h1></div>
    <div class="hud"><span class="pill" id="mapName">Map</span><span class="pill">Wave <b id="wave">0</b>/20</span><span class="pill">🪙 <b id="coins">0</b></span><span class="pill">❤️ <b id="lives">0</b></span><button class="icon" id="pause" title="Pause">⏸</button><button class="icon" id="mute" title="Sound">🔊</button></div></header>

  <div class="bar">

  </div>
  <div class="panel" id="panel" hidden></div>
  <p class="tip">Tap a tower, then tap the grass to see where it reaches. Tap ✓ to build. Tap a tower on the map to upgrade it: pick the gold path <b>or</b> the red path.</p>
</div>

<script>
// ================= sound =================

 bad:()=>once('bad',200,()=>tone(180,.25,'sawtooth',.06,.6)),win:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.16,'triangle',.08),i*110)),horn:()=>once('horn',350,()=>tone(220,.22,'sawtooth',.035,1.5)),tap:()=>tone(520,.05,'triangle',.05),clink:()=>once('clink',80,()=>tone(1500,.04,'square',.03)),boom:()=>tone(90,.5,'sawtooth',.09,.4),zap:()=>once('zap',90,()=>tone(900,.06,'sine',.04,1.6))}})();

const rnd=(a,b)=>a+Math.random()*(b-a);

// ================= maps =================
const MAPS=[
 {id:'jerusalem',name:'Jerusalem Walls',verse:'Nehemiah 4',diff:1,grass:['#8fb5a8','#6f9a8e'],path:['#e2c69f','#f3dfc0'],deco:'trees',

 const segs=[];for(let i=0;i<m.P.length-1;i++){const a=m.P[i],bb=m.P[i+1];segs.push({a,b:bb,l:Math.hypot(bb[0]-a[0],bb[1]-a[1])})}
 const gr=b.createLinearGradient(0,0,0,H);gr.addColorStop(0,m.grass[0]);gr.addColorStop(1,m.grass[1]);b.fillStyle=gr;b.fillRect(0,0,W,H);
 let s=7+m.id.length;const r=()=>(s=(s*9301+49297)%233280)/233280;
 for(let i=0;i<420;i++){b.strokeStyle=m.id==='jericho'?`rgba(160,120,70,${.08+r()*.08})`:`rgba(255,255,255,${.05+r()*.07})`;b.lineWidth=1.4;const x=r()*W,y=r()*H;b.beginPath();b.moveTo(x,y);b.lineTo(x+(r()-.5)*4,y-4-r()*5);b.stroke()}
 if(m.water){const wt=m.water;const wg=b.createRadialGradient(wt.x,wt.y-20,10,wt.x,wt.y,wt.rx);wg.addColorStop(0,'#7ed3e6');wg.addColorStop(1,'#3f8fb5');b.fillStyle='#e9d8b5';b.beginPath();b.ellipse(wt.x,wt.y,wt.rx+12,wt.ry+10,0,0,7);b.fill();b.fillStyle=wg;b.beginPath();b.ellipse(wt.x,wt.y,wt.rx,wt.ry,0,0,7);b.fill();
  b.strokeStyle='rgba(255,255,255,.5)';b.lineWidth=2;for(let i=0;i<14;i++){const x=wt.x+(r()-.5)*wt.rx*1.4,y=wt.y+(r()-.5)*wt.ry*1.2;b.beginPath();b.arc(x,y,8,Math.PI*1.1,Math.PI*1.9);b.stroke()}
  for(const [bx,by] of [[150,500],[300,520]]){b.fillStyle='#7a4a2b';b.beginPath();b.moveTo(bx-26,by);b.lineTo(bx+26,by);b.lineTo(bx+18,by+12);b.lineTo(bx-18,by+12);b.closePath();b.fill();b.fillStyle='#fff8eb';b.beginPath();b.moveTo(bx,by-34);b.lineTo(bx,by-2);b.lineTo(bx-18,by-2);b.closePath();b.fill();b.fillStyle='#7a4a2b';b.fillRect(bx-1,by-36,3,36)}}
 for(let i=0;i<30;i++){const x=r()*W,y=r()*H;if(distToPath(x,y,segs)<50||inWater(x,y,m))continue;b.fillStyle=['#faa731','#fff8eb','#c86354','#a28fbc'][i%4];for(let k=0;k<5;k++){b.beginPath();b.arc(x+Math.cos(k*1.26)*3.5,y+Math.sin(k*1.26)*3.5,2.6,0,7);b.fill()}b.fillStyle='#fff3c4';b.beginPath();b.arc(x,y,2,0,7);b.fill()}

 b.fillStyle='#7a4a2b';b.beginPath();b.moveTo(gx,gy-28);b.arcTo(gx+30,gy-48,gx+60,gy-28,30);b.lineTo(gx+60,gy+32);b.lineTo(gx,gy+32);b.closePath();b.fill();
 b.fillStyle='#9b5b2e';b.fillRect(gx+6,gy-22,48,54);b.strokeStyle='#7a4a2b';b.lineWidth=3;for(let x=gx+18;x<gx+54;x+=12){b.beginPath();b.moveTo(x,gy-22);b.lineTo(x,gy+32);b.stroke()}

 return c}

// ================= towers: 2 upgrade paths × 3 tiers =================
const TW={

};
function stats(t){const T=TW[t.k],s={...T.base},a=t.p==='A'?t.lvl:0,b=t.p==='B'?t.lvl:0;
 if(t.k==='sling'){if(a>=1)s.rate=.45;if(a>=2){s.rate=.33;s.range=145}if(a>=3)s.multi=3;if(b>=1)s.pierce=3;if(b>=2){s.dmg=2;s.iron=true}if(b>=3){s.pierce=12;s.dmg=3;s.big=true}}
 if(t.k==='horn'){s.iron=true;if(a>=1)s.range=115;if(a>=2)s.rate=.85;if(a>=3)s.shout=true;if(b>=1)s.dmg=2;if(b>=2)s.buff=.2;if(b>=3){s.buff=.4;s.dmg=3}}
 if(t.k==='lamp'){if(a>=1){s.slow=.48;s.range=145}if(a>=2)s.slow=.6;if(a>=3)s.fire=true;if(b>=1)s.rate=.75;if(b>=2)s.dmg=2;if(b>=3){s.beam=6;s.rate=.6}}
 if(t.k==='net'){s.iron=true;if(a>=1)s.splash=58;if(a>=2)s.rate=1.0;if(a>=3){s.splash=86;s.hold=true}if(b>=1)s.dmg=2;if(b>=2){s.range=190;s.rate=1.1}if(b>=3){s.dmg=3;s.boss=4}}

 ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(2,17,22,8,0,0,7);ctx.fill();

 ctx.rotate(aim);
 if(k==='sling'){const n=p==='A'&&l>=3?3:1;for(let j=0;j<n;j++){ctx.save();ctx.rotate((j-(n-1)/2)*.45);ctx.strokeStyle='#7a4a2b';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,12);ctx.lineTo(0,2);ctx.lineTo(-7,-8);ctx.moveTo(0,2);ctx.lineTo(7,-8);ctx.stroke();ctx.strokeStyle='#fbe8ca';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-7,-8);ctx.quadraticCurveTo(0,-2,7,-8);ctx.stroke();ctx.restore()}

  const fl=1+(p==='A'?l*.35:0)+Math.sin(performance.now()/120)*.08;ctx.fillStyle=p==='A'&&l>=3?'#ff8a3d':'#ffd98a';ctx.beginPath();ctx.moveTo(8,2);ctx.quadraticCurveTo(8+7*fl,2-10*fl,10,2-15*fl);ctx.quadraticCurveTo(5,2-8*fl,8,2);ctx.fill();

 if(k==='net'){const sz=p==='A'?1+l*.12:1;ctx.scale(sz,sz);ctx.strokeStyle='#fff8eb';ctx.lineWidth=1.6;for(let i=-9;i<=9;i+=6){ctx.beginPath();ctx.moveTo(i,-9);ctx.lineTo(i,15);ctx.stroke();ctx.beginPath();ctx.moveTo(-10,i+3);ctx.lineTo(10,i+3);ctx.stroke()}ctx.strokeStyle=p==='B'&&l>=1?'#c86354':'#7a4a2b';ctx.lineWidth=p==='B'?3+l:3;ctx.strokeRect(-11,-10,22,26)}

function newBalloon(kind,l,d=0){const b={kind,l,d,x:-30,y:MAP.P[0][1],slow:0,hold:0,burn:0,wob:Math.random()*6,id:Math.random()};

function bSpeed(b){const s=b.kind==='swift'?175:b.kind==='cloud'?32:b.kind==='iron'?70:SPEED[Math.max(0,Math.min(4,b.l))];return s*(1+(MAP.diff-1)*.35)}
function leakDmg(b){return b.kind==='cloud'?30:b.kind==='iron'?4:b.l+1}

function makeWave(n){const d=MAP.diff,q=[],count=Math.round((9+n*2.6)*d),maxL=Math.min(4,Math.floor((n-1)/3));

 if(n>=5)for(let i=0;i<Math.round((n-3)*.8*d);i++)q.splice(Math.floor(Math.random()*q.length),0,{kind:'swift',l:0,gap:.25});
 if(n>=8)for(let i=0;i<Math.round((n-6)*.5*d);i++)q.splice(Math.floor(Math.random()*q.length),0,{kind:'iron',l:3,gap:.6});
 if(n===10||n===20||(d>1.2&&n===15))for(let i=0;i<(n===20?2:1);i++)q.push({kind:'cloud',l:4,gap:2.5});

function hit(b,dmg,t,src){if(b.dead)return;

// ================= simulation (fixed small steps so fast mode never skips) =================
function step(dt){
 if(inWave){spawnT-=dt;if(spawnQ.length&&spawnT<=0){const s=spawnQ.shift();balloons.push(newBalloon(s.kind,s.l));spawnT=s.gap}if(!spawnQ.length&&!balloons.length)endWave()}
 const buff=new Map();for(const t of towers){const S=stats(t);if(S.buff)for(const o of towers)if(o!==t&&Math.hypot(o.x-t.x,o.y-t.y)<150)buff.set(o,Math.max(buff.get(o)||0,S.buff))}
 for(const b of balloons){b.slow=0}
 for(const t of towers)if(t.k==='lamp'){const S=stats(t);for(const b of balloons)if(Math.hypot(b.x-t.x,b.y-t.y)<S.range){b.slow=Math.max(b.slow,S.slow);if(S.fire&&b.kind!=='cloud')b.burn=Math.max(b.burn,2)}}
 for(const b of balloons){if(b.burn>0){b.burn-=dt;b.bt=(b.bt||0)-dt;if(b.bt<=0){b.bt=.6;hit(b,1,null,{iron:true});parts.push({x:b.x,y:b.y-10,vx:rnd(-10,10),vy:-50,c:'#ff8a3d',r:3,life:.4})}}
  if(b.hold>0){b.hold-=dt;continue}b.d+=bSpeed(b)*(1-b.slow)*dt;[b.x,b.y]=at(b.d);
  if(b.d>=PLEN-70){b.dead=true;const dmg=leakDmg(b);lives-=dmg;shake=.25;Snd.bad();texts.push({x:880,y:b.y-20,t:`−${dmg} ❤️`,c:'#c86354',life:1});if(lives<=0){lives=0;outOfLives()}}}
 for(const t of towers){const S=stats(t);t.cd-=dt*(1+(buff.get(t)||0));if(t.cd>0)continue;
  const inR=balloons.filter(b=>!b.dead&&b.hold<=0||!b.dead).filter(b=>Math.hypot(b.x-t.x,b.y-t.y)<S.range);if(!inR.length)continue;
  const tgt=inR.reduce((a,b)=>b.d>a.d?b:a);t.aim=Math.atan2(tgt.y-t.y,tgt.x-t.x)+Math.PI/2;t.cd=S.rate;t.kick=.12;
  if(t.k==='sling'){const n=S.multi||1;for(let j=0;j<n;j++){const a=Math.atan2(tgt.y-t.y,tgt.x-t.x)+(j-(n-1)/2)*.22;shots.push({k:'stone',x:t.x,y:t.y,vx:Math.cos(a)*720,vy:Math.sin(a)*720,p:S.pierce,dmg:S.dmg,t,S,hit:new Set(),r:S.big?11:5,life:.6})}parts.push({x:t.x+Math.sin(t.aim)*18,y:t.y-Math.cos(t.aim)*18,vx:0,vy:0,c:'#fff8eb',r:6,life:.12})}
  if(t.k==='net'){shots.push({k:'net',x:t.x,y:t.y,sx:t.x,sy:t.y,tx:tgt,lx:tgt.x,ly:tgt.y,dmg:S.dmg,splash:S.splash,t,S,prog:0})}
  if(t.k==='horn'){t.n=(t.n||0)+1;const shout=S.shout&&t.n%3===0;rings.push({x:t.x,y:t.y,r:12,max:S.range,c:shout?'#fff':'#faa731',w:shout?9:5});inR.forEach(b=>{hit(b,S.dmg*(shout?3:1),t,S);if(shout)b.hold=.9});Snd.horn();if(shout)shake=.15}
  if(t.k==='lamp'){if(S.beam){const a=Math.atan2(tgt.y-t.y,tgt.x-t.x),hits=balloons.filter(b=>{const dx=b.x-t.x,dy=b.y-t.y,along=dx*Math.cos(a)+dy*Math.sin(a),off=Math.abs(-dx*Math.sin(a)+dy*Math.cos(a));return along>0&&along<S.range*1.4&&off<18}).slice(0,S.beam);hits.forEach(b=>hit(b,S.dmg,t,S));rings.push({beam:true,x:t.x,y:t.y,a,len:S.range*1.4,life:.18})}
   else{hit(tgt,S.dmg,t,S);rings.push({zap:true,x:t.x,y:t.y-10,x2:tgt.x,y2:tgt.y,life:.12})}Snd.zap()}}
 for(const s of shots){if(s.k==='stone'){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;for(const b of balloons)if(!b.dead&&!s.hit.has(b)&&Math.hypot(b.x-s.x,b.y-s.y)<(b.kind==='cloud'?36:14)+s.r){hit(b,s.dmg,s.t,s.S);s.hit.add(b);s.p-=b.kind==='cloud'?4:1;if(s.p<=0){s.done=true;break}}if(s.life<=0)s.done=true}
  else{if(!s.tx.dead){s.lx=s.tx.x;s.ly=s.tx.y}s.prog+=dt*2.6;s.x=s.sx+(s.lx-s.sx)*s.prog;s.y=s.sy+(s.ly-s.sy)*s.prog-Math.sin(Math.PI*Math.min(1,s.prog))*40;
   if(s.prog>=1){s.done=true;rings.push({x:s.lx,y:s.ly,r:8,max:s.splash,c:'#a28fbc',w:3,net:true});balloons.forEach(b=>{if(!b.dead&&Math.hypot(b.x-s.lx,b.y-s.ly)<s.splash+(b.kind==='cloud'?30:0)){hit(b,s.dmg,s.t,s.S);if(s.S.hold&&b.kind!=='cloud')b.hold=.8}})}}}
 shots=shots.filter(s=>!s.done);balloons=balloons.filter(b=>!b.dead);
 for(const t of towers)t.kick=Math.max(0,(t.kick||0)-dt);
}
function tickFx(dt){rings.forEach(r=>{if(r.r!=null&&!r.beam&&!r.zap)r.r+=280*dt;else r.life-=dt});rings=rings.filter(r=>r.beam||r.zap?r.life>0:r.r<r.max);

 const c=b.kind==='iron'?'#8f9a99':b.kind==='swift'?'#f4f1ea':COLORS[Math.max(0,Math.min(4,b.l))];
 g.strokeStyle='rgba(41,70,74,.5)';g.lineWidth=1.2;g.beginPath();g.moveTo(x,y+15);g.quadraticCurveTo(x+4,y+22,x,y+28);g.stroke();
 g.fillStyle='rgba(0,0,0,.12)';g.beginPath();g.ellipse(x+3,y+30,9,3,0,0,7);g.fill();
 if(b.kind==='swift'){g.strokeStyle='rgba(255,255,255,.8)';g.lineWidth=2;for(let i=0;i<3;i++){g.beginPath();g.moveTo(x-16-i*3,y-6+i*6);g.lineTo(x-26-i*3,y-6+i*6);g.stroke()}}
 const gr=g.createRadialGradient(x-5,y-6,2,x,y,17);gr.addColorStop(0,'#fff');gr.addColorStop(.2,c);gr.addColorStop(1,b.kind==='iron'?'#5f6968':c);g.fillStyle=gr;g.beginPath();g.ellipse(x,y,12,15,0,0,7);g.fill();
 g.fillStyle=c;g.beginPath();g.moveTo(x-3,y+14);g.lineTo(x+3,y+14);g.lineTo(x,y+18);g.fill();
 if(b.kind==='iron'){g.strokeStyle='#5f6968';g.lineWidth=1.5;g.beginPath();g.moveTo(x-12,y);g.lineTo(x+12,y);g.moveTo(x,y-15);g.lineTo(x,y+15);g.stroke();g.fillStyle='#d6dbda';[[-6,-7],[6,-7],[-6,7],[6,7]].forEach(([u,v])=>{g.beginPath();g.arc(x+u,y+v,1.5,0,7);g.fill()})}
 if(b.kind==='n'&&b.l>=3){g.strokeStyle='rgba(255,255,255,.65)';g.lineWidth=2;g.beginPath();g.ellipse(x,y,15,18,0,0,7);g.stroke()}
 if(b.slow){g.fillStyle='rgba(255,217,138,.35)';g.beginPath();g.arc(x,y,18,0,7);g.fill()}
 if(b.hold>0){g.strokeStyle='#a28fbc';g.lineWidth=1.5;g.beginPath();g.arc(x,y,17,0,7);g.stroke();g.beginPath();g.moveTo(x-17,y);g.lineTo(x+17,y);g.moveTo(x,y-17);g.lineTo(x,y+17);g.stroke()}
 if(b.burn>0){g.fillStyle='rgba(255,138,61,.6)';g.beginPath();g.moveTo(x-5,y-12);g.quadraticCurveTo(x,y-26,x+5,y-12);g.fill()}}
function canPlace(x,y){return x>25&&x<875&&y>25&&y<H-25&&distToPath(x,y)>40&&!inWater(x,y)&&!towers.some(t=>Math.hypot(t.x-x,t.y-y)<42)}
function draw(){g.save();if(shake>0)g.translate(rnd(-1,1)*shake*14,rnd(-1,1)*shake*14);
 if(bg)g.drawImage(bg,0,0,W,H);
 if(sel){const S=stats(sel);g.fillStyle='rgba(255,248,235,.2)';g.strokeStyle='rgba(255,248,235,.8)';g.lineWidth=2;g.setLineDash([8,6]);g.beginPath();g.arc(sel.x,sel.y,S.range,0,7);g.fill();g.stroke();g.setLineDash([])}
 for(const t of towers)if(t.k==='lamp'){const S=stats(t);const gr=g.createRadialGradient(t.x,t.y,4,t.x,t.y,S.range);gr.addColorStop(0,S.fire?'rgba(255,138,61,.35)':'rgba(255,217,138,.35)');gr.addColorStop(1,'rgba(255,217,138,0)');g.fillStyle=gr;g.beginPath();g.arc(t.x,t.y,S.range,0,7);g.fill()}
 balloons.slice().sort((a,b)=>a.y-b.y).forEach(drawBalloon);
 towers.slice().sort((a,b)=>a.y-b.y).forEach(t=>drawTower(g,t.k,t.x,t.y-(t.kick||0)*20,1+(t.kick||0),t));
 for(const s of shots){if(s.k==='stone'){g.fillStyle='rgba(0,0,0,.15)';g.beginPath();g.arc(s.x+3,s.y+6,s.r,0,7);g.fill();g.fillStyle='#9aa5a3';g.beginPath();g.arc(s.x,s.y,s.r,0,7);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(s.x-s.r*.3,s.y-s.r*.3,s.r*.3,0,7);g.fill()}
  else{g.save();g.translate(s.x,s.y);g.rotate(s.prog*8);const z=8+s.prog*8;g.strokeStyle='#fff8eb';g.lineWidth=1.6;for(let i=-z;i<=z;i+=5){g.beginPath();g.moveTo(i,-z);g.lineTo(i,z);g.stroke();g.beginPath();g.moveTo(-z,i);g.lineTo(z,i);g.stroke()}g.restore()}}
 for(const r of rings){if(r.beam){g.strokeStyle='rgba(255,217,138,.85)';g.lineWidth=10;g.lineCap='round';g.beginPath();g.moveTo(r.x,r.y);g.lineTo(r.x+Math.cos(r.a)*r.len,r.y+Math.sin(r.a)*r.len);g.stroke();g.strokeStyle='#fff';g.lineWidth=3;g.stroke();continue}
  if(r.zap){g.strokeStyle='#ffd98a';g.lineWidth=3;g.beginPath();g.moveTo(r.x,r.y);const mx=(r.x+r.x2)/2+rnd(-10,10),my=(r.y+r.y2)/2+rnd(-10,10);g.lineTo(mx,my);g.lineTo(r.x2,r.y2);g.stroke();continue}
  g.strokeStyle=r.c;g.globalAlpha=Math.max(0,1-r.r/r.max);g.lineWidth=r.w||5;g.beginPath();g.arc(r.x,r.y,r.r,0,7);g.stroke();g.globalAlpha=1}
 for(const p of parts){g.globalAlpha=Math.max(0,Math.min(1,p.life*3));g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill()}g.globalAlpha=1;
 if(pick&&(ghost||mouse)){const pt=ghost||mouse,ok=canPlace(pt.x,pt.y),S=stats({k:pick,lvl:0});g.fillStyle=ok?'rgba(255,248,235,.25)':'rgba(200,99,84,.3)';g.strokeStyle=ok?'#fff8eb':'#c86354';g.lineWidth=2;g.beginPath();g.arc(pt.x,pt.y,S.range,0,7);g.fill();g.stroke();g.globalAlpha=.8;drawTower(g,pick,pt.x,pt.y);g.globalAlpha=1}
 for(const t of texts){g.globalAlpha=Math.min(1,t.life*2);g.font=`700 ${t.big?26:16}px FavorSans, sans-serif`;g.textAlign='center';g.lineWidth=4;g.strokeStyle='rgba(41,70,74,.8)';g.strokeText(t.t,t.x,t.y);g.fillStyle=t.c;g.fillText(t.t,t.x,t.y)}g.globalAlpha=1;
 if(lives>0&&lives<=10&&started){const a=.18+Math.sin(performance.now()/200)*.08;const v=g.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.85);v.addColorStop(0,'rgba(200,99,84,0)');v.addColorStop(1,`rgba(200,99,84,${a})`);g.fillStyle=v;g.fillRect(0,0,W,H)}
 g.restore();
 if(paused&&started&&$('ov').hidden&&!document.querySelector('.rv-wrap')){g.fillStyle='rgba(41,70,74,.55)';g.fillRect(0,0,W,H);g.fillStyle='#fff';g.font='400 56px Agharti, Impact, sans-serif';g.textAlign='center';g.fillText('PAUSED',W/2,H/2)}}
let last=performance.now();
function loop(now){let dt=Math.min(.05,(now-last)/1000);last=now;if(started&&!paused){let left=dt*fast;while(left>0){const h=Math.min(1/120,left);step(h);left-=h}hud()}tickFx(dt);draw();requestAnimationFrame(loop)}

// ================= flow =================
function overlay(html){const o=$('ov');o.hidden=false;o.innerHTML=html}
async function outOfLives(){paused=true;inWave=inWave;
 overlay(`<h2>The gate is breaking!</h2><p>Say this week’s memory verse to get <b>+10 hearts</b> and keep defending.</p><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="btn" id="rv">Get an extra life</button><button class="btn green" id="quit">End game</button></div>`);
 $('rv').onclick=async()=>{$('ov').hidden=true;await RMBVerse.memoryQuiz({title:'Extra life!'});lives=10;revives++;balloons=balloons.filter(b=>b.d<PLEN-200);paused=false;banner('+10 hearts!');Snd.up();hud()};
 $('quit').onclick=()=>{overlay(`<h2>You reached wave ${wave}</h2><p>Best on ${MAP.name}: wave ${progress[MAP.id]||0}. Nehemiah’s team never gave up. Try again!</p><div style="display:flex;gap:8px"><button class="btn" id="again">Try again</button><button class="btn green" id="mm">Maps</button></div>`);$('again').onclick=()=>startMap(mapIdx);$('mm').onclick=mapMenu}}
function startMap(i){mapIdx=i;setMap(MAPS[i]);towers=[];balloons=[];shots=[];rings=[];parts=[];texts=[];coins=Math.round(320+i*80);lives=50;wave=0;inWave=false;sel=null;pick=null;ghost=null;revives=0;started=true;paused=false;$('ov').hidden=true;$('confirm').hidden=true;panel();hud();banner(MAPS[i].name)}
function mapMenu(){paused=true;started=false;sel=null;panel();const unlocked=i=>i===0||(progress[MAPS[i-1].id]||0)>=20;
 overlay(`<h2>Guard the wall!</h2><p>Balloons are floating toward the city gate. Build towers to pop them! Beat all 20 waves to open the next map.</p><div class="maps">${MAPS.map((m,i)=>`<button class="map ${unlocked(i)?'':'locked'}" data-m="${i}"><canvas width="480" height="280"></canvas><div style="padding:6px 8px 0">${unlocked(i)?'':'🔒 '}${m.name}<small>${unlocked(i)?(progress[m.id]?`Best: wave ${progress[m.id]}/20${progress[m.id]>=20?' ⭐':''}`:`${m.verse} · ${['Easy','Medium','Hard'][i]}`):`Beat ${MAPS[i-1].name} to open`}</small></div></button>`).join('')}</div><p style="font-size:13px;opacity:.8">Before each new wave, you’ll fill in a verse from today’s Bible reading.</p>`);
 document.querySelectorAll('.map').forEach(b=>{const i=+b.dataset.m;b.querySelector('canvas').getContext('2d').drawImage(drawScene(MAPS[i],480,280,1),0,0);if(unlocked(i))b.onclick=()=>{Snd.tap();startMap(i)}})}
// ================= input =================
const pos=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}};
function showConfirm(p){const c=$('confirm'),r=cv.getBoundingClientRect(),sr=$('stage').getBoundingClientRect();c.hidden=false;c.style.left=(r.left-sr.left+p.x/W*r.width)+'px';c.style.top=(r.top-sr.top+p.y/H*r.height)+'px'}
function build(p){const T=TW[pick];if(coins<T.cost){texts.push({x:p.x,y:p.y-24,t:'Need more coins!',c:'#fff',life:1});Snd.bad();return}if(!canPlace(p.x,p.y)){Snd.bad();return}
 coins-=T.cost;towers.push({k:pick,x:p.x,y:p.y,lvl:0,p:null,cd:0,spent:T.cost,popped:0,aim:0});burst(p.x,p.y+10,'#e6cba3',14);Snd.build();ghost=null;$('confirm').hidden=true;
 if(coins<T.cost){pick=null;document.querySelectorAll('.card').forEach(x=>x.classList.remove('on'))}hud()}
cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse')mouse=pos(e)});cv.addEventListener('pointerleave',()=>mouse=null);
cv.addEventListener('pointerdown',e=>{if(!started)return;const p=pos(e);
 const t=towers.find(t=>Math.hypot(t.x-p.x,t.y-p.y)<30);if(t&&!pick){sel=sel===t?null:t;Snd.tap();panel();return}
 if(pick){if(e.pointerType==='mouse'){build(p);return}
  if(ghost&&Math.hypot(ghost.x-p.x,ghost.y-p.y)<28){build(ghost);return}ghost=p;showConfirm(p);Snd.tap();return}
 sel=null;panel()});
$('cOk').onclick=()=>ghost&&build(ghost);$('cNo').onclick=()=>{ghost=null;$('confirm').hidden=true};
$('go').onclick=()=>{Snd.tap();nextWave()};
$('fast').onclick=()=>{fast=fast===1?2:fast===2?3:1;$('fast').textContent=fast+'×'};
$('pause').onclick=()=>{if(!started)return;paused=!paused;$('pause').textContent=paused?'▶':'⏸'};
const setMute=()=>{$('mute').textContent=muted?'🔇':'🔊';try{localStorage.setItem('rmb-arcade-mute',muted?'1':'0')}catch{}};$('mute').onclick=()=>{muted=!muted;setMute()};setMute();
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();nextWave()}if(e.key==='Escape'){pick=null;sel=null;ghost=null;$('confirm').hidden=true;panel();document.querySelectorAll('.card').forEach(x=>x.classList.remove('on'))}if(e.key==='p')$('pause').click()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&started&&!paused){paused=true;$('pause').textContent='▶'}});
setMap(MAPS[0]);shop();hud();mapMenu();requestAnimationFrame(loop);
window.__walls={get state(){return{coins:Math.floor(coins),lives,wave,towers:towers.length,balloons:balloons.length,inWave,paused,map:MAP.id}},
 place:(k,x,y)=>{pick=k;build({x,y});pick=null},upgrade:(i,path)=>{sel=towers[i];panel();document.querySelector(`[data-up="${path}"]`)?.click();sel=null;panel()},start:i=>startMap(i),give:n=>{coins+=n},wave:()=>nextWave(),setWave:n=>{wave=n}};
</script></body></html>
